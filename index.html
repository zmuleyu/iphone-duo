<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iPhone Duo · Fold Preview</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <main id="stage">
    <div id="stage-background" aria-hidden="true"></div>
    <div id="viewport" aria-label="iPhone Duo 3D fold preview"></div>

    <a class="github-link" href="https://github.com/zmuleyu/iphone-duo" target="_blank" rel="noopener noreferrer" aria-label="View project on GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>
    </a>

    <div class="control-dock">
      <section class="source-column" aria-label="Scene assets">
        <div class="section-head">
          <div>
            <strong>Assets</strong>
            <span>Reality → RedBlack</span>
          </div>
        </div>

        <div class="source-buttons" role="group" aria-label="Scene source assets">
          <button role="button" data-ui-theme="custom" aria-selected="false" disabled>Reality</button>
          <button id="redblack-button" type="button" aria-label="Upload RedBlack target image" disabled>RedBlack</button>
        </div>

        <input id="ui-upload" type="file" accept="image/*" hidden disabled>
        <input id="redblack-upload" type="file" accept="image/*" hidden disabled>
      </section>

      <section class="transport-column" aria-label="Fold animation controls">
        <div class="transport-topline">
          <button id="play" class="action-primary" aria-label="Play unfold animation" disabled>
            <svg id="pause-icon" viewBox="0 0 24 24" hidden><path d="M8 6v12M16 6v12"/></svg>
            <svg id="play-icon" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></svg>
            <span id="play-label">Unfold</span>
          </button>

          <div class="endpoint-buttons">
            <button id="closed-button" type="button" disabled>Closed</button>
            <button id="open-button" type="button" disabled>Open</button>
          </div>

          <div class="timeline-title-block">
            <strong>Fold</strong>
            <span>Clean crossfade · stable hinge</span>
          </div>

          <div class="status-row" aria-live="polite">
            <span id="progress-readout">0%</span>
            <span id="angle-readout">0°</span>
          </div>
        </div>

        <div class="progress-control">
          <input id="angle" aria-label="Fold progress" type="range" min="0" max="180" value="0" step="0.1" disabled>
        </div>

        <div class="edit-panels" aria-label="Editing controls">
          <details id="fold-motion-panel" class="edit-panel">
            <summary>
              <span><strong>Fold Motion</strong><small id="fold-total-readout">Total 3.10s</small></span>
              <i aria-hidden="true">⌄</i>
            </summary>
            <div class="edit-panel-body">
              <div class="motion-grid">
                <label>
                  <span>Closed Hold <output id="closed-hold-value">0.45s</output></span>
                  <input id="closed-hold" type="range" min="0" max="1.5" value="0.45" step="0.05" disabled>
                </label>
                <label>
                  <span>Unfold <output id="unfold-duration-value">1.80s</output></span>
                  <input id="unfold-duration" type="range" min="0.8" max="4" value="1.8" step="0.05" disabled>
                </label>
                <label>
                  <span>Open Hold <output id="open-hold-value">0.85s</output></span>
                  <input id="open-hold" type="range" min="0" max="2.5" value="0.85" step="0.05" disabled>
                </label>
              </div>

              <div class="motion-row">
                <label class="select-field">
                  <span>Easing</span>
                  <select id="fold-easing" disabled>
                    <option value="smooth">Smooth</option>
                    <option value="cinematic">Cinematic</option>
                    <option value="linear">Linear</option>
                  </select>
                </label>

                <div class="motion-blur-field">
                  <span>Motion Blur</span>
                  <div class="segmented" role="group" aria-label="Motion blur strength">
                    <button type="button" data-motion-blur="off" aria-pressed="false" disabled>Off</button>
                    <button type="button" data-motion-blur="natural" aria-pressed="true" disabled>Natural</button>
                    <button type="button" data-motion-blur="strong" aria-pressed="false" disabled>Strong</button>
                  </div>
                </div>

                <button id="fold-motion-reset" class="quiet-button" type="button" disabled>Reset</button>
              </div>
            </div>
          </details>

          <details id="tower-fx-panel" class="edit-panel future-panel">
            <summary>
              <span><strong>Tower FX</strong><small>V5.0.7 · Open only</small></span>
              <i aria-hidden="true">⌄</i>
            </summary>
            <div class="edit-panel-body tower-preview">
              <p>Reserved for Open Hold → Tower Activation. It stays visually inactive in V5.0.6.</p>
              <div class="tower-future-grid" aria-disabled="true">
                <label><span>Start Delay</span><input type="range" min="0" max="1" value="0.2" step="0.05" disabled data-future></label>
                <label><span>Intensity</span><input type="range" min="0" max="1.5" value="1" step="0.05" disabled data-future></label>
                <label><span>Pulse</span><select disabled data-future><option>Single</option></select></label>
              </div>
            </div>
          </details>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
