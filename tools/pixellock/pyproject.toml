[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixellock-image-pipeline"
version = "0.2.2"
description = "Geometry-first image pipeline: pixel-locked outpaint and geometry-locked A/B restyle"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "httpx>=0.27",
  "pydantic>=2.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pixellock*"]
